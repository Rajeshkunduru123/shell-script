- name: variables
  hosts: localhost
  vars: #variables declaration
    course: "terraform"
    trainer: "siva"
    duration: "15hrs"
  tasks:
  - name: print override information
    vars: # task level variables
      course: "devops"
    ansible.builtin.debug:  
      msg: "Hi, we are learning {{course}} from trainer {{trainer}}, duration is {{duration}}."  

  - name: print information
      
      ansible.builtin.debug:  
      msg: "Hi, we are learning {{course}} from trainer {{trainer}}, duration is {{duration}}."      